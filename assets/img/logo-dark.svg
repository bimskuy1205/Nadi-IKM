<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Gauge Arc Segment (Top Right) -->
  <g transform="translate(300, 115)">
    <path d="M 0,-85 A 85,85 0 0,1 60,-60" fill="none" stroke="#F0A444" stroke-width="12" stroke-linecap="round" stroke-dasharray="14 6"/>
    <path d="M 65,-55 A 85,85 0 0,1 85,0" fill="none" stroke="#F0A444" stroke-width="12" stroke-linecap="round"/>
    <path d="M -60,-60 A 85,85 0 0,0 -85,0 A 85,85 0 0,0 0,85" fill="none" stroke="#1E445E" stroke-width="12" stroke-linecap="round"/>
    <path d="M 0,85 A 85,85 0 0,0 60,60" fill="none" stroke="#0DB3A6" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#59D8D1" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Monogram N -->
  <g transform="translate(300, 115)">
    <!-- Left vertical bar -->
    <path d="M -56,-70 L -24,-70 L -24,70 L -56,70 Z" fill="#E2F1F8"/>
    <path d="M -56,-70 L -24,-70 L -24,-10 L -56,20 Z" fill="#0DB3A6"/>

    <!-- Right vertical bar -->
    <path d="M 24,-70 L 56,-70 L 56,70 L 24,70 Z" fill="#FFFFFF"/>
    <path d="M 24,-70 L 56,-70 L 56,-20 L 24,-20 Z" fill="#59D8D1"/>

    <!-- Diagonal facet -->
    <path d="M -24,-70 L 24,30 L 24,70 L -24,-30 Z" fill="#173447"/>
    <path d="M -24,-20 L 24,70 L 10,70 L -24,10 Z" fill="#0DB3A6" opacity="0.9"/>

    <!-- Orbit Ellipse -->
    <ellipse cx="0" cy="18" rx="100" ry="34" fill="none" stroke="#0DB3A6" stroke-width="6" transform="rotate(-18)" opacity="0.7"/>
    <path d="M -90,45 C -50,75 50,55 94,-5" fill="none" stroke="#59D8D1" stroke-width="6" stroke-linecap="round" filter="url(#glowDark)"/>

    <!-- Amber Sensor Node -->
    <circle cx="-78" cy="38" r="9.5" fill="#F0A444" stroke="#0A1F2E" stroke-width="3" filter="url(#glowDark)"/>

    <!-- Heartbeat Pulse / ECG Line in Safety Amber -->
    <path d="M -35,5 L -14,5 L -5,-30 L 8,30 L 16,-12 L 24,8 L 38,5" fill="none" stroke="#F0A444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowDark)"/>
  </g>

  <!-- Brand Typography -->
  <text x="300" y="275" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="3" fill="#FFFFFF">
    NADI<tspan fill="#F0A444">-</tspan>IKM
  </text>

  <line x1="105" y1="305" x2="165" y2="305" stroke="#59D8D1" stroke-width="2.5" stroke-linecap="round"/>
  <text x="300" y="310" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="14.5" text-anchor="middle" letter-spacing="5.5" fill="#59D8D1">
    INTELLIGENT MACHINE CARE
  </text>
  <line x1="435" y1="305" x2="495" y2="305" stroke="#59D8D1" stroke-width="2.5" stroke-linecap="round"/>
</svg>