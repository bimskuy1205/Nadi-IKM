<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="100%" height="100%">
  <defs>
    <linearGradient id="holoCyanAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#FFA834"/>
    </linearGradient>
    <linearGradient id="plasmaFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E36"/>
      <stop offset="50%" stop-color="#FFA834"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1929"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Holographic Crest Frame -->
  <rect x="6" y="8" width="134" height="134" rx="28" fill="url(#badgeBg)" stroke="url(#holoCyanAmber)" stroke-width="3.5"/>
  <rect x="14" y="16" width="118" height="118" rx="22" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- Emblem Center (73, 75) -->
  <g transform="translate(73, 75)">
    <!-- Outer Radar Gauge Arc -->
    <path d="M -46,-20 A 50,50 0 1,1 46,20" fill="none" stroke="url(#holoCyanAmber)" stroke-width="5" stroke-linecap="round"/>
    <path d="M -38,32 A 50,50 0 0,1 -46,-20" fill="none" stroke="#FF2E93" stroke-width="4" stroke-dasharray="6 5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.35"/>

    <!-- Bold Geometric N Monogram -->
    <path d="M -26,-30 L -11,-30 L -11,30 L -26,30 Z" fill="#FFFFFF"/>
    <path d="M 11,-30 L 26,-30 L 26,30 L 11,30 Z" fill="#00F2FE"/>
    <path d="M -11,-30 L 14,18 L 14,30 L -11,-18 Z" fill="url(#plasmaFlame)"/>

    <!-- Holographic Orbit Ring -->
    <ellipse cx="0" cy="4" rx="54" ry="18" fill="none" stroke="#00FF87" stroke-width="2.5" transform="rotate(-16)" opacity="0.85"/>

    <!-- Live ECG / Vibration Heartbeat Wave Across Emblem -->
    <path d="M -48,4 L -20,4 L -12,-22 L -2,26 L 8,-14 L 16,10 L 24,4 L 48,4" fill="none" stroke="#FFA834" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
    <circle cx="-48" cy="4" r="4.5" fill="#00F2FE" filter="url(#neonGlow)"/>
    <circle cx="48" cy="4" r="4.5" fill="#FF2E93" filter="url(#neonGlow)"/>
  </g>

  <!-- Right Side: Heroic Brand Wordmark & Subtitle -->
  <g transform="translate(162, 0)">
    <!-- Top Micro Telemetry Tag -->
    <rect x="0" y="16" width="255" height="22" rx="6" fill="#0D2235" stroke="#00F2FE" stroke-width="1.2"/>
    <circle cx="13" cy="27" r="4" fill="#00FF87"/>
    <text x="25" y="31" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="11" letter-spacing="2" fill="#00F2FE">
      EDGE AI RETROFIT SYSTEM
    </text>

    <!-- Giant Wordmark: NADI-IKM -->
    <text x="0" y="96" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="68" letter-spacing="3" fill="#FFFFFF">
      NADI<tspan fill="url(#plasmaFlame)">-</tspan><tspan fill="url(#holoCyanAmber)">IKM</tspan>
    </text>

    <!-- Bottom Subtitle Bar -->
    <line x1="2" y1="114" x2="530" y2="114" stroke="url(#holoCyanAmber)" stroke-width="2" opacity="0.6"/>
    <text x="2" y="134" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="14" letter-spacing="4.5" fill="#FFA834">
      INTELLIGENT MACHINE CARE • HOLOGRAM CAD
    </text>
  </g>
</svg>
